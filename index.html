<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>น้องนับตังก์ พาคำนวณ - แอปคำนวณสูตรพิเศษ</title>
    <!-- นำเข้าฟอนต์ Kanit น่ารัก อ่านง่าย -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            
            /* พื้นหลังไล่เฉดสีพาสเทลสดใส */
            background: linear-gradient(135deg, #a8edda 0%, #fed6e3 100%);
            background-attachment: fixed;
        }

        /* การ์ดคำนวณสไตล์การ์ตูนกระจกใส */
        .calculator-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 30px 25px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 4px solid #ffffff;
            width: 100%;
            max-width: 400px;
            position: relative;
            text-align: center;
        }

        /* หัวข้อแอปและมาสคอต */
        .header-section {
            margin-bottom: 20px;
        }

        .mascot-avatar {
            width: 90px;
            height: 90px;
            background: #ffeb3b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin: 0 auto 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 3px solid #ff4081;
        }

        h2 {
            color: #6a1b9a;
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 5px 0;
            text-shadow: 1px 1px 0px #fff;
        }

        .subtitle {
            color: #7b1fa2;
            font-size: 14px;
            font-weight: 600;
            margin: 0;
        }

        /* ช่องกรอกข้อมูล */
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #4a148c;
            font-weight: 600;
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1bee7;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            background-color: #faf5ff;
            color: #333;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #ab47bc;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(171, 71, 188, 0.15);
        }

        /* ปุ่มกด */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
        }

        .btn-calc {
            background: linear-gradient(135deg, #8e24aa, #ab47bc);
            color: white;
        }

        .btn-calc:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(142, 36, 170, 0.3);
        }

        .btn-clear {
            background: #f48fb1;
            color: white;
        }

        .btn-clear:hover {
            background: #ec407a;
            transform: translateY(-2px);
        }

        /* กล่องแสดงผลลัพธ์ */
        .result-box {
            margin-top: 22px;
            padding: 18px;
            background: #f3e5f5;
            border-radius: 16px;
            display: none;
            border: 2px dashed #ce93d8;
            text-align: left;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-item {
            margin-bottom: 10px;
            font-size: 16px;
            color: #4a148c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .highlight {
            font-weight: 700;
            color: #d81b60;
            font-size: 18px;
        }

        .combined-highlight {
            font-weight: 700;
            color: #2e7d32;
            font-size: 22px;
            letter-spacing: 3px;
            background: #e8f5e9;
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid #a5d6a7;
        }

        .divider {
            border: 0;
            border-top: 2px dashed #ce93d8;
            margin: 12px 0;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <div class="header-section">
        <div class="mascot-avatar">👧🏻</div>
        <h2>น้องนับตังก์ พาคำนวณ</h2>
        <p class="subtitle">เก่งคิด เก่งนับ เก่งมาก ๆ </p>
    </div>
    
    <div class="input-group">
        <label for="num1">เลข 3 ตัวบน</label>
        <input type="text" id="num1" inputmode="numeric" placeholder="กรอกตัวเลข เช่น 721" onkeypress="handleEnter(event)">
    </div>

    <div class="input-group">
        <label for="num2">เลข 2 ตัวล่าง</label>
        <input type="text" id="num2" inputmode="numeric" placeholder="กรอกตัวเลข เช่น 87" onkeypress="handleEnter(event)">
    </div>

    <div class="btn-group">
        <button class="btn-calc" onclick="calculate()">คำนวณ</button>
        <button class="btn-clear" onclick="clearData()">ล้างข้อมูล</button>
    </div>

    <div class="result-box" id="resultBox">
        <div class="result-item">
            <span><strong>สูตรที่ 1:</strong></span>
            <span id="res1" class="highlight">-</span>
        </div>
        <div class="result-item">
            <span><strong>สูตรที่ 2:</strong></span>
            <span id="res2" class="highlight">-</span>
        </div>
        <hr class="divider">
        <div class="result-item">
            <span><strong>รวมวิน:</strong></span>
            <span id="resCombined" class="combined-highlight">-</span>
        </div>
    </div>
</div>

<script>
    // ตัดทศนิยม 2 ตำแหน่งโดยไม่ปัดเศษ
    function truncateToTwoDecimals(num) {
        const numStr = num.toString();
        const dotIndex = numStr.indexOf('.');
        if (dotIndex === -1) {
            return num.toFixed(2);
        }
        return numStr.substring(0, dotIndex + 3).padEnd(dotIndex + 3, '0');
    }

    function calculate() {
        const input1 = document.getElementById('num1').value.trim();
        const input2 = document.getElementById('num2').value.trim();

        if (input1 === "" || input2 === "" || isNaN(input1) || isNaN(input2)) {
            alert("กรุณากรอกตัวเลขที่ถูกต้องให้ครบทั้ง 2 ช่องด้วยนะคะ ");
            return;
        }

        const n1 = parseFloat(input1);
        const n2 = parseFloat(input2);

        // --- สูตรที่ 1: ยึดหลักการเดิม (n1 * 52% ทศนิยม 2 ตำแหน่ง ไม่ปัดเศษ) ---
        const rawResult1 = n1 * 0.52;
        const truncatedResult1 = truncateToTwoDecimals(rawResult1);
        
        // เช็กเลข 6 และ 9 เฉพาะในผลลัพธ์สูตรที่ 1
        const hasSixInRes1 = truncatedResult1.includes('6');
        const hasNineInRes1 = truncatedResult1.includes('9');
        
        let displayRes1 = truncatedResult1;
        let addedDigitFromRes1 = "";

        if (hasSixInRes1 && !hasNineInRes1) {
            displayRes1 += " ( 9 )";
            addedDigitFromRes1 = "9";
        } else if (hasNineInRes1 && !hasSixInRes1) {
            displayRes1 += " ( 6 )";
            addedDigitFromRes1 = "6";
        }
        
        document.getElementById('res1').innerText = displayRes1;

        // --- สูตรที่ 2: (เลข 2 หลักท้ายของ n1 * n2) / 99 ---
        const cleanInput1 = Math.abs(parseInt(input1, 10)).toString();
        const lastTwoDigits = parseInt(cleanInput1.slice(-2) || '0', 10);
        
        const rawResult2 = (lastTwoDigits * n2) / 99;
        const truncatedResult2 = truncateToTwoDecimals(rawResult2);
        document.getElementById('res2').innerText = truncatedResult2;

        // --- คำนวณ "รวมวิน" ---
        const uniqueDigits = [];
        
        // 1. นำตัวเลขทั้งหมดจากผลลัพธ์สูตรที่ 1 มารวมวิน (หลักการเดิม)
        for (let char of truncatedResult1) {
            if (char >= '0' && char <= '9') {
                if (!uniqueDigits.includes(char)) {
                    uniqueDigits.push(char);
                }
            }
        }

        // 2. นำเฉพาะ 2 ตัวหลังจุดทศนิยมของสูตรที่ 2 มารวมวิน
        const decimalsOfRes2 = truncatedResult2.split('.')[1] || "";
        for (let char of decimalsOfRes2) {
            if (char >= '0' && char <= '9') {
                if (!uniqueDigits.includes(char)) {
                    uniqueDigits.push(char);
                }
            }
        }

        // 3. นำเลขสลับ 6/9 จากสูตรที่ 1 ใส่รวมด้วย (ถ้ามี)
        if (addedDigitFromRes1 !== "" && !uniqueDigits.includes(addedDigitFromRes1)) {
            uniqueDigits.push(addedDigitFromRes1);
        }

        document.getElementById('resCombined').innerText = uniqueDigits.join('');
        document.getElementById('resultBox').style.display = 'block';
    }

    function clearData() {
        document.getElementById('num1').value = '';
        document.getElementById('num2').value = '';
        document.getElementById('res1').innerText = '-';
        document.getElementById('res2').innerText = '-';
        document.getElementById('resCombined').innerText = '-';
        
        document.getElementById('resultBox').style.display = 'none';
        document.getElementById('num1').focus();
    }

    function handleEnter(event) {
        if (event.key === 'Enter') {
            calculate();
        }
    }
</script>

</body>
</html>
